<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الخدمات المتكامل</title>
  <style>
    /* إعدادات الخط والجسم */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- تأثير الستارة (Curtain Effect) --- */
    .curtain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .curtain-half {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #1e88e5; /* اللون الأزرق الأساسي */
      transition: transform 1.5s cubic-bezier(0.77, 0, 0.175, 1);
    }

    .curtain-left { left: 0; transform: translateX(0); }
    .curtain-right { right: 0; transform: translateX(0); }

    .curtain-logo {
      position: relative;
      z-index: 10000;
      max-width: 300px;
      height: auto;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* كلاس الفتح */
    .curtain-container.opened .curtain-left { transform: translateX(-100%); }
    .curtain-container.opened .curtain-right { transform: translateX(100%); }
    .curtain-container.opened .curtain-logo { opacity: 0; transform: scale(0.8); }

    /* --- تنسيق الصناديق (قائمة تحت بعضها) --- */
    .container {
      width: 100%;
      max-width: 600px;
      margin-top: 50px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      padding: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      opacity: 0; /* مخفية للأنيميشن */
      transform: translateY(30px) scale(0.9);
      transition: transform 0.4s ease, box-shadow 0.4s ease, background 0.3s ease;
    }

    /* أنيميشن الظهور التدريجي */
    .card.show {
      animation: fadeInUpScale 0.8s forwards ease-out;
    }

    @keyframes fadeInUpScale {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* تأخير ظهور كل صندوق ليظهروا بالترتيب */
    .card:nth-child(1) { animation-delay: 1.5s; }
    .card:nth-child(2) { animation-delay: 1.8s; }
    .card:nth-child(3) { animation-delay: 2.1s; }
    .card:nth-child(4) { animation-delay: 2.4s; }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      background: #f8f9fa;
    }

    .icon {
      font-size: 35px;
      margin-left: 20px;
      color: #1e88e5;
    }

    .card-text {
      font-size: 20px;
      font-weight: bold;
      color: #333;
    }

    /* --- النافذة المنبثقة (Modal) --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 11000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .modal-content h3 { margin-bottom: 20px; color: #1e88e5; }

    textarea, input {
      width: 95%;
      margin-bottom: 15px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-family: 'Cairo', sans-serif;
      font-size: 16px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 25px;
      border: none;
      border-radius: 12px;
      background: #1e88e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover { background: #1565c0; transform: translateY(-2px); }
    .btn-close { background: #ff5252; }
    .btn-close:hover { background: #d32f2f; }

  </style>
</head>
<body>

  <div class="curtain-container">
    <div class="curtain-half curtain-left"></div>
    <div class="curtain-half curtain-right"></div>
    <img src="IMG-20260418-WA0008.jpg" alt="logo" class="curtain-logo">
  </div>

  <div class="container">
    <div class="card" onclick="openModal('دعم الطالب', 1)">
      <div class="icon">📄</div>
      <div class="card-text">دعم الطالب</div>
    </div>
    <div class="card" onclick="openModal('تحرير الشهادات الجامعية', 2)">
      <div class="icon">✏️</div>
      <div class="card-text">تحرير الشهادات الجامعية</div>
    </div>
    <div class="card" onclick="openModal('تمويل المعلم', 3)">
      <div class="icon">📚</div>
      <div class="card-text">تمويل المعلم</div>
    </div>
    <div class="card" onclick="openModal('المنح الدولية', 4)">
      <div class="icon">💡</div>
      <div class="card-text">المنح الدولية</div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modal-title">اكتب هنا</h3>
      <textarea id="editor" rows="5" placeholder="أدخل محتوى الملف هنا..."></textarea>
      <input type="text" id="filename" placeholder="اسم الملف">
      <div class="btn-group">
        <button onclick="saveFile()">حفظ الملف</button>
        <button class="btn-close" onclick="closeModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    let currentBox = null;

    // تشغيل الأنيميشن عند تحميل الصفحة
    window.addEventListener('load', () => {
      const curtain = document.querySelector('.curtain-container');
      const cards = document.querySelectorAll('.card');

      // 1. انتظر ثانية واحدة ثم افتح الستارة
      setTimeout(() => {
        curtain.classList.add('opened');
        
        // 2. تفعيل ظهور الصناديق تدريجياً
        cards.forEach(card => {
          card.classList.add('show');
        });
      }, 1000);
    });

    // وظائف النافذة المنبثقة
    function openModal(title, boxNumber) {
      currentBox = boxNumber;
      document.getElementById("modal").style.display = "flex";
      document.getElementById("editor").value = "";
      document.getElementById("filename").value = title + ".txt";
      document.getElementById("modal-title").innerText = title;
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function saveFile() {
      const text = document.getElementById("editor").value;
      const fileName = document.getElementById("filename").value || "file.txt";

      if (text.trim() === "") {
        alert("يرجى كتابة نص قبل الحفظ");
        return;
      }

      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      closeModal();
    }
  </script>
</body>
</html>
