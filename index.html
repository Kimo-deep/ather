<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام الخدمات المتكامل</title>
  <style>
    /* إعدادات عامة لمنع أي إزاحة جانبية */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden; /* منع التمرير الجانبي تماماً */
    }

    /* --- تأثير الستارة المتجاوب --- */
    .curtain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    .curtain-half {
      position: absolute;
      top: 0;
      width: 50.5%; /* زيادة طفيفة لضمان سد الفجوة في المنتصف */
      height: 100%;
      background: #1e88e5;
      transition: transform 1.2s cubic-bezier(0.7, 0, 0.3, 1);
    }

    .curtain-left {
      left: 0;
      transform: translateX(0);
    }

    .curtain-right {
      right: 0;
      transform: translateX(0);
    }

    /* اللوجو المتجاوب في المنتصف */
    .curtain-logo {
      position: relative;
      z-index: 10000;
      width: 70%; /* يأخذ مساحة مناسبة في الجوال */
      max-width: 280px; /* لا يتجاوز هذا الحجم في الكمبيوتر */
      height: auto;
      object-fit: contain;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    /* حالات فتح الستارة */
    .curtain-container.opened .curtain-left { transform: translateX(-100%); }
    .curtain-container.opened .curtain-right { transform: translateX(100%); }
    .curtain-container.opened .curtain-logo { opacity: 0; transform: scale(0.6); }

    /* --- حاوية الصناديق --- */
    .container {
      width: 90%;
      max-width: 500px;
      margin-top: 40px;
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      padding: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s ease;
    }

    .card.show {
      animation: fadeInUpScale 0.6s forwards ease-out;
    }

    @keyframes fadeInUpScale {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* توقيت ظهور الصناديق */
    .card:nth-child(1) { animation-delay: 1.4s; }
    .card:nth-child(2) { animation-delay: 1.6s; }
    .card:nth-child(3) { animation-delay: 1.8s; }
    .card:nth-child(4) { animation-delay: 2.0s; }

    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .icon {
      font-size: 30px;
      margin-left: 15px;
      color: #1e88e5;
    }

    .card-text {
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    /* --- النافذة المنبثقة (Modal) --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 11000;
      padding: 15px;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    textarea, input {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: 'Cairo', sans-serif;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #1e88e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { background: #1565c0; }
    .btn-close { background: #ff5252; }
  </style>
</head>
<body>

  <div class="curtain-container">
    <div class="curtain-half curtain-left"></div>
    <div class="curtain-half curtain-right"></div>
    <img src="IMG-20260418-WA0008.jpg" alt="logo" class="curtain-logo">
  </div>

  <div class="container">
    <div class="card" onclick="openModal('دعم الطالب', 1)">
      <div class="icon">📄</div>
      <div class="card-text">دعم الطالب</div>
    </div>
    <div class="card" onclick="openModal('تحرير الشهادات الجامعية', 2)">
      <div class="icon">✏️</div>
      <div class="card-text">تحرير الشهادات الجامعية</div>
    </div>
    <div class="card" onclick="openModal('تمويل المعلم', 3)">
      <div class="icon">📚</div>
      <div class="card-text">تمويل المعلم</div>
    </div>
    <div class="card" onclick="openModal('المنح الدولية', 4)">
      <div class="icon">💡</div>
      <div class="card-text">المنح الدولية</div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modal-title">العنوان</h3>
      <textarea id="editor" rows="5" placeholder="اكتب هنا..."></textarea>
      <input type="text" id="filename" placeholder="اسم الملف">
      <div class="btn-group">
        <button onclick="saveFile()">حفظ الملف</button>
        <button class="btn-close" onclick="closeModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    let currentBox = null;

    // تفعيل الحركات عند التحميل
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelector('.curtain-container').classList.add('opened');
        document.querySelectorAll('.card').forEach(card => {
          card.classList.add('show');
        });
      }, 1000);
    });

    // وظائف المودال
    function openModal(title, boxNumber) {
      currentBox = boxNumber;
      document.getElementById("modal").style.display = "flex";
      document.getElementById("editor").value = "";
      document.getElementById("filename").value = title + ".txt";
      document.getElementById("modal-title").innerText = title;
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function saveFile() {
      const text = document.getElementById("editor").value;
      const fileName = document.getElementById("filename").value || "file.txt";

      if (text.trim() === "") {
        alert("يرجى كتابة نص");
        return;
      }

      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      closeModal();
    }
  </script>
</body>
</html>
