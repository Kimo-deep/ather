<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تصميم حديث</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(120deg, #fce4ec, #e3f2fd);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      background: #1e88e5;
      color: white;
      padding: 20px;
      font-size: 28px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    header img {
      max-width: 100%;
      height: auto;
      max-height: 200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 250px);
      gap: 30px;
      margin-top: 50px;
      padding-bottom: 50px;
    }

    .card {
      background-image: linear-gradient(rgba(255,255,255,0.7), rgba(255,255,255,0.7)), url('IMG-20260418-WA0008.jpg');
      background-size: cover;
      background-position: center;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      padding: 30px;
      color: black;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeInUp 1s forwards;
      transition: transform 0.4s, box-shadow 0.4s;
    }

    .card:nth-child(1) { animation-delay: 0.5s; }
    .card:nth-child(2) { animation-delay: 0.8s; }
    .card:nth-child(3) { animation-delay: 1.1s; }
    .card:nth-child(4) { animation-delay: 1.4s; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card:hover {
      transform: translateY(-10px) scale(1.1) rotate(2deg);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 40px;
      margin-bottom: 10px;
      color: #1e88e5;
    }

    /* نافذة منبثقة */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    textarea, input {
      width: 90%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: 'Cairo', sans-serif;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      background: #1e88e5;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-weight: bold;
      margin-top: 10px;
    }

    button:hover {
      background: #1565c0;
    }

    .btn-close {
      background: #e53935;
    }

    .btn-close:hover {
      background: #b71c1c;
    }
  .fade-slider {
  position: relative;
  width: 300px; /* يمكنك تكبير العرض حسب رغبتك */
  height: 200px; /* يمكنك تكبير الارتفاع حسب رغبتك */
  margin: 50px auto;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.fade-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0; /* الصور مخفية في البداية */
  transition: opacity 2s ease-in-out; /* انتقال ناعم جداً لمدة ثانيتين */
}

.fade-img.active {
  opacity: 1; /* الصورة النشطة فقط هي التي تظهر */
}


  </style>
</head>
<body>
  <header>
    <img src="IMG-20260418-WA0008.jpg" alt="logo">
  </header>

  <div class="grid">
    <div class="card" onclick="openModal('دعم الطالب', 1)">
      <div class="icon">📄</div>
      دعم الطالب
    </div>
    <div class="card" onclick="openModal('تحرير الشهادات الجامعية', 2)">
      <div class="icon">✏️</div>
      تحرير الشهادات الجامعية
    </div>
    <div class="card" onclick="openModal('تمويل المعلم', 3)">
      <div class="icon">📚</div>
      تمويل المعلم
    </div>
    <div class="card" onclick="openModal('المنح الدولية', 4)">
      <div class="icon">💡</div>
      المنح الدولية
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modal-title">اكتب هنا</h3>
      <textarea id="editor" rows="5" placeholder="أدخل النص هنا..."></textarea>
      <input type="text" id="filename" placeholder="اسم الملف">
      <br>
      <button onclick="saveFile()">حفظ الملف</button>
      <button class="btn-close" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <div class="fade-slider">
  <img src="WhatsApp Image 2026-04-21 at 5.00.59 PM.jpeg" class="fade-img active" alt="صورة 1">
  <img src="WhatsApp Image 2026-04-21 at 5.00.59 PM (2).jpeg" class="fade-img" alt="صورة 2">
  <img src="WhatsApp Image 2026-04-21 at 5.00.59 PM (1).jpeg" class="fade-img" alt="صورة 3">
</div>

  <script>
    let currentBox = null;

    function openModal(title, boxNumber) {
      currentBox = boxNumber;
      document.getElementById("modal").style.display = "flex";
      document.getElementById("editor").value = "";
      document.getElementById("filename").value = title + ".txt";
      document.getElementById("modal-title").innerText = title;
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    function saveFile() {
      const text = document.getElementById("editor").value;
      const fileName = document.getElementById("filename").value || "file" + currentBox + ".txt";

      if (text.trim() === "") {
        alert("خطأ: لا يوجد نص للحفظ");
        return;
      }

      const blob = new Blob([text], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
      closeModal();
    }
    let slideIndex = 0;
const slides = document.querySelectorAll(".fade-img");

function showSlides() {
  // إخفاء الصورة الحالية
  slides[slideIndex].classList.remove("active");
  
  // الانتقال للصورة التالية
  slideIndex = (slideIndex + 1) % slides.length;
  
  // إظهار الصورة الجديدة
  slides[slideIndex].classList.add("active");
}

// تبديل الصور كل 5 ثوانٍ (وقت كافٍ ليشعر المستخدم بالهدوء)
setInterval(showSlides, 5000);
  </script>
</body>
</html>
